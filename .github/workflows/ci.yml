name: CI

on:
    push:
        branches: [main]
    pull_request:

jobs:
    quality:
        name: Lint / Format / Typecheck / Test / Build
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: oven-sh/setup-bun@v2
            - run: bun install --frozen-lockfile
            - run: bun run format:check
            - run: bun run lint
            - run: bun run typecheck
            - run: bun test
            - run: bun run build

    node-compat:
        name: Node.js ${{ matrix.node }} 兼容性
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                node: ['22.19', '24']
        steps:
            - uses: actions/checkout@v4
            - uses: oven-sh/setup-bun@v2
            - uses: actions/setup-node@v4
              with:
                  node-version: ${{ matrix.node }}
            - run: bun install --frozen-lockfile
            - run: bun run build
            - run: node scripts/node-compat.mjs
